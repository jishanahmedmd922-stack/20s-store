<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<="width=device-width, initial-scale=1">
<title>20’s | E Fades</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3eb;color:#382719;font-family:Arial,sans-serif}
header{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd2c2;position:sticky;top:0;background:#f7f3eb;z-index:5}
.logo{font-size:27px;font-weight:bold;letter-spacing:3px}
nav a{color:#382719;text-decoration:none;margin-left:12px;font-size:11px}
.cart-btn{background:#382719;color:white;border:0;padding:11px 13px;font-size:12px}
.hero{padding:85px 7%;background:#e9dfcf;text-align:center}
.hero small,.sub{letter-spacing:3px}
.hero h1{font-family:Georgia,serif;font-size:45px;margin:22px 0}
.hero p{letter-spacing:2px;font-size:12px}
.btn{display:inline-block;background:#382719;color:white;padding:14px 25px;text-decoration:none;margin-top:18px;font-size:12px;letter-spacing:2px}
section{padding:50px 6%}
.heading{text-align:center;font-family:Georgia,serif;font-size:30px}
.sub{text-align:center;color:#8b7764;font-size:12px}
.collections{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
.collection{background:#dfd1bd;padding:30px 10px;text-align:center}
.collection h2{font-family:Georgia,serif;font-size:18px}
.categories{text-align:center;margin:25px 0}
.categories button{background:transparent;border:1px solid #8b7764;padding:10px;margin:4px;color:#382719}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.product{background:#eee7dc;padding:12px}
.photo{height:170px;background:#dfd5c7;display:flex;align-items:center;justify-content:center;color:#8b7764;font-size:12px}
.product h3{font-size:15px}
.product button{width:100%;padding:12px;background:#382719;color:white;border:0}
footer{background:#382719;color:#f7f3eb;text-align:center;padding:35px}
#cartPanel{display:none;position:fixed;inset:0;background:#0008;z-index:10;justify-content:flex-end}
.cart-content{background:#f7f3eb;width:100%;max-width:420px;height:100%;padding:22px;overflow:auto}
.cart-top{display:flex;justify-content:space-between;align-items:center}
.cart-top button{background:none;border:0;font-size:25px;color:#382719}
.cart-item{border-bottom:1px solid #ddd2c2;padding:15px 0}
.cart-item h3{margin:0 0 8px;font-size:15px}
.qty{display:flex;align-items:center;gap:12px;margin-top:10px}
.qty button{background:#382719;color:white;border:0;padding:7px 12px}
.remove{background:none!important;color:#8b3d2b!important;text-decoration:underline;padding-left:0!important}
.total{border-top:1px solid #c9bba9;margin-top:20px;padding-top:15px;font-size:18px;font-weight:bold}
.checkout{width:100%;padding:15px;background:#382719;color:white;border:0;margin-top:18px}
function showProducts(list){
document.getElementById("products").innerHTML=list.map(p=>`
<div class="product">
${p.images ? `
<div class="product-gallery">
${p.images.map(src=>`
<img src="${src}" alt="${p.name}" loading="lazy">
`).join("")}
</div>
` : `<div class="photo">20’s PRODUCT PHOTO</div>`}
<h3>${p.name}</h3>
<p>
${p.originalPrice ? `<del>৳ ${p.originalPrice}</del>` : ""}
<strong>৳ ${p.price}</strong>
</p>
<button onclick="addToCart(${p.id})">ADD TO BAG</button>
</div>
`).join("");
}
